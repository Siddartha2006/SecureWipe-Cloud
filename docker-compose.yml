services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securewipe
      POSTGRES_USER: securewipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securewipe -d securewipe"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://securewipe:${POSTGRES_PASSWORD}@postgres:5432/securewipe
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://securewipe:${POSTGRES_PASSWORD}@postgres:5432/securewipe
      REDIS_URL: redis://redis:6379/0
      VERIFY_BASE_URL: ${VERIFY_BASE_URL}
      CERTIFICATE_PRIVATE_KEY: ${CERTIFICATE_PRIVATE_KEY}
      PUBLIC_VERIFICATION_KEY: ${PUBLIC_VERIFICATION_KEY}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  cleanup:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["python", "-m", "app.cleanup"]
    environment:
      DATABASE_URL: postgresql+psycopg://securewipe:${POSTGRES_PASSWORD}@postgres:5432/securewipe
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      disable: true
    restart: unless-stopped
  frontend:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
