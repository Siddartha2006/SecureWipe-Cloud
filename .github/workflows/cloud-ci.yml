name: Cloud application CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: NEXT_PUBLIC_API_URL=https://api.example.invalid NEXT_PUBLIC_APP_URL=https://example.invalid npm run build
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest ruff pip-audit
      - run: python -m pytest tests
      - run: ruff check --select F backend/app tests
      - run: pip-audit -r backend/requirements.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t securewipe-api backend
      - run: docker build -t securewipe-worker -f worker/Dockerfile .
      - run: docker build -t securewipe-web web
